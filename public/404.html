<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b10" />
    <title>UploadNPlay</title>
    <script>
      fetch('/UploadNPlay/index.html')
        .then(response => response.text())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {
          document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">UploadNPlay could not load.</p>';
        });
    </script>
  </head>
  <body></body>
</html>
