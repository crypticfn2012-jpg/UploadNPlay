<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile - UploadNPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-width:320px;background:#171a21;color:#d6d7d8;font-family:Inter,Arial,sans-serif}.nav{height:58px;border-bottom:1px solid #2a2f37;display:flex;align-items:center;justify-content:space-between;padding:0 20px;max-width:1180px;margin:auto}.brand{color:#fff;text-decoration:none;font-size:21px;font-weight:700;letter-spacing:-.045em}.brand span{color:#66c0a8}.back{color:#9298a1;text-decoration:none;font-size:12px}.back:hover{color:#fff}.page{max-width:900px;margin:auto;padding:44px 20px 80px}.head{background:#181818;border:1px solid #2d3239;border-radius:14px;padding:26px;display:grid;grid-template-columns:100px 1fr;gap:20px}.avatar{width:100px;height:100px;border-radius:50%;background:#242a31;border:2px solid #363c45;display:grid;place-items:center;overflow:hidden;color:#858e98;font-size:32px;font-weight:700}.avatar img{width:100%;height:100%;object-fit:cover}.name{margin:0;color:#fff;font-size:29px;letter-spacing:-.04em}.handle{margin-top:4px;color:#7f8790;font-size:13px}.bio{margin:12px 0 0;color:#c1c6cb;font-size:13px;line-height:1.6;white-space:pre-wrap}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.badge{padding:4px 8px;border-radius:999px;border:1px solid #39414a;background:#20252c;color:#9ea6af;font-size:10px;font-weight:700;letter-spacing:.06em}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stat{min-width:115px;padding:11px 13px;background:#20242b;border:1px solid #303640;border-radius:9px}.stat b{display:block;color:#fff;font-size:18px}.stat span{color:#757e87;font-size:10px}.section{margin-top:28px}.section h2{margin:0 0 14px;color:#fff;font-size:19px}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.game{background:#181818;border:1px solid #2d3239;border-radius:10px;overflow:hidden;text-decoration:none}.game img,.placeholder{width:100%;aspect-ratio:16/9;object-fit:cover;background:#242a31}.placeholder{display:grid;place-items:center;color:#68717b;font-size:46px;font-weight:700}.game-copy{padding:12px}.game-copy h3{margin:0 0 4px;color:#eee;font-size:13px}.game-copy p{margin:0;color:#7b838c;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:22px;background:#181818;border:1px solid #2d3239;border-radius:10px;color:#808992;font-size:12px}@media(max-width:700px){.page{padding:30px 15px 60px}.head{grid-template-columns:1fr}.games{grid-template-columns:1fr 1fr}}@media(max-width:450px){.games{grid-template-columns:1fr}}
</style></head>
<body><nav class="nav"><a class="brand" href="../"><span>Upload</span>NPlay</a><a class="back" href="../">Back to UploadNPlay</a></nav><main class="page" id="app"><div class="empty">Loading profile...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=supabase.createClient('https://rldidvwcylirjyfktvtg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJybGRpZHZ3Y3lsaXJqeWZrdHZ0ZyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg2MjIzNDkwLCJleHAiOjIxMDE3OTk0OTB9.YO5zeu5uL3siDDPVfs9c9v_VCETHixTWXjzotVOEp0U');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const u=(new URLSearchParams(location.search).get('user')||'').trim().toLowerCase();
async function load(){const app=document.getElementById('app');if(!u){app.innerHTML='<div class="empty">No username was provided.</div>';return}const {data:p}=await client.from('profiles').select('id,username,display_name,bio,avatar_url,is_dev').eq('username',u).maybeSingle();if(!p){app.innerHTML='<div class="empty">Profile not found.</div>';return}const {data:g}=await client.from('games').select('id,title,description,thumbnail_url').eq('developer_id',p.id).eq('status','approved').order('created_at',{ascending:false});const games=g||[];let views=0;if(games.length){const r=await client.from('game_views').select('id',{count:'exact',head:true}).in('game_id',games.map(x=>x.id));views=r.count||0}const name=esc(p.display_name||p.username),initial=esc((p.display_name||p.username||'?').slice(0,1).toUpperCase());app.innerHTML=`<section class="head"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:initial}</div><div><h1 class="name">${name}</h1><div class="handle">@${esc(p.username)}</div><div class="bio">${esc(p.bio||'')}</div><div class="badges">${p.is_dev?'<span class="badge">Developer</span>':''}</div><div class="stats"><div class="stat"><b>${games.length}</b><span>Published games</span></div><div class="stat"><b>${views}</b><span>Total views</span></div></div></div></section><section class="section"><h2>Published Games</h2><div class="games">${games.length?games.map(x=>`<a class="game" href="../#\/game\/${encodeURIComponent(x.id)}">${x.thumbnail_url?`<img src="${esc(x.thumbnail_url)}" alt="">`:`<div class="placeholder">${esc((x.title||'?').slice(0,1).toUpperCase())}</div>`}<div class="game-copy"><h3>${esc(x.title)}</h3><p>${esc(x.description||'Browser game')}</p></div></a>`).join(''):'<div class="empty">No published games yet.</div>'}</div></section>`}load();
</script></body></html>
