<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UploadNPlay Achievements</title><style>body{margin:0;background:#171a21;color:#d6d7d8;font:14px Inter,Arial,sans-serif}main{max-width:1050px;margin:auto;padding:40px 20px 80px}h1,h2,h3{color:#fff}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.muted{color:#858c95}.card{background:#1d2128;border:1px solid #303640;border-radius:8px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;font-weight:600;color:#cfd2d6}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;background:#11151a;border:1px solid #353c46;color:#eee;border-radius:4px;padding:10px}.field textarea{min-height:90px;resize:vertical}.primary{background:#75c9ae;color:#10211c;border:0;border-radius:4px;padding:10px 14px;font-weight:700}.secondary{background:#252a31;border:1px solid #3a414b;color:#ddd;border-radius:4px;padding:10px 14px}.danger{background:#2b2022;border:1px solid #59393d;color:#e2a4a4;border-radius:4px;padding:9px 12px}.ach{display:grid;grid-template-columns:1fr auto;gap:15px;border-top:1px solid #2b3139;padding:16px 0}.ach:first-child{border-top:0}.actions{display:flex;gap:7px;align-items:center}.notice{padding:11px 13px;background:#191d23;border:1px solid #343a43;color:#abb1b8;border-radius:4px}.notice.error{color:#e1a4a4;border-color:#5b3838}.notice.success{color:#8ad5bb}.secret{word-break:break-all;background:#101419;border:1px dashed #4a535e;padding:14px;border-radius:5px;color:#d7eee6}.hidden{display:none}.links{display:flex;gap:12px;font-size:12px}.links a{color:#75c9ae}.count{font-size:12px;color:#858c95}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.ach{grid-template-columns:1fr}.actions{flex-wrap:wrap}}</style></head>
<body><main><div class="top"><div><div class="links"><a href="../../#/developer">Developer Portal</a><a href="../api/">API</a><a href="../sdk/">SDK</a></div><h1>Achievements</h1><p class="muted">Create and manage achievements for your UploadNPlay games.</p></div><button id="logout" class="secondary">Sign out</button></div><div id="app"><div class="notice">Loading...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://rldidvwcylirjyfktvtg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJybGRpZHZ3Y3lsaXJqeWZrdHZ0ZyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg2MjIzNDkwLCJleHAiOjIxMDE3OTk0OTB9.YO5zeu5uL3siDDPVfs9c9v_VCETHixTWXjzotVOEp0U';
const sb=supabase.createClient(SB_URL,SB_KEY); let currentUser=null; let games=[]; let selected=null; let editing=null;
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){app.innerHTML='<div class="notice error">Sign in to manage achievements. <a href="../../#/auth">Sign in</a></div>';return;}currentUser=user;await loadGames();}
async function loadGames(){const r=await sb.from('games').select('id,title,status').eq('developer_id',currentUser.id).order('created_at',{ascending:false});if(r.error){app.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return;}games=r.data||[];render();}
function render(){app.innerHTML='<div class="card"><div class="grid"><div class="field"><label>Game</label><select id="game">'+games.map(g=>'<option value="'+g.id+'" '+(selected===g.id?'selected':'')+'>'+esc(g.title)+' ('+esc(g.status)+')</option>').join('')+'</select></div><div><div class="count">Achievements are game-scoped. Client unlocks can be disabled per achievement for server-only rewards.</div></div></div></div><div id="content"></div>';document.getElementById('game').onchange=e=>{selected=e.target.value;loadAchievements()};if(!selected&&games[0]){selected=games[0].id;document.getElementById('game').value=selected;}if(selected)loadAchievements();}
async function loadAchievements(){const content=document.getElementById('content');content.innerHTML='<div class="notice">Loading achievements...</div>';const r=await sb.from('game_achievements').select('*').eq('game_id',selected).order('created_at',{ascending:true});if(r.error){content.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return;}const list=r.data||[];content.innerHTML='<div class="card"><div class="top"><div><h2>Achievement manager</h2><div class="count">'+list.length+' created</div></div><button class="primary" id="new">New achievement</button></div><div id="list">'+(list.length?list.map(row).join(''):'<p class="muted">No achievements yet.</p>')+'</div></div><div class="card"><h2>Server API credentials</h2><p class="muted">Use the public key in browser games. Keep the server secret on your backend only.</p><div id="creds">Loading...</div><button class="secondary" id="rotate">Generate / rotate server secret</button></div>';document.getElementById('new').onclick=()=>showForm();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=list.find(x=>x.id===b.dataset.edit);showForm(editing)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeAchievement(b.dataset.delete));loadCredentials();document.getElementById('rotate').onclick=rotateSecret;}
function row(a){return '<div class="ach"><div><h3>'+esc(a.name)+'</h3><div class="muted">'+esc(a.achievement_key)+' · '+a.points+' points · '+(a.secret?'secret':'visible')+' · '+(a.client_unlockable?'client unlock':'server only')+'</div><p>'+esc(a.description)+'</p></div><div class="actions"><button class="secondary" data-edit="'+a.id+'">Edit</button><button class="danger" data-delete="'+a.id+'">Delete</button></div></div>';}
function showForm(a){const c=document.createElement('div');c.className='card';c.innerHTML='<h2>'+(a?'Edit':'New')+' achievement</h2><div class="grid"><div class="field"><label>Key</label><input id="akey" value="'+esc(a?.achievement_key||'')+'" placeholder="first-win"></div><div class="field"><label>Name</label><input id="aname" value="'+esc(a?.name||'')+'" placeholder="First Win"></div><div class="field"><label>Points</label><input id="apoints" type="number" min="0" max="10000" value="'+(a?.points??10)+'"></div><div class="field"><label>Icon URL</label><input id="aicon" value="'+esc(a?.icon_url||'')+'"></div></div><div class="field"><label>Description</label><textarea id="adesc">'+esc(a?.description||'')+'</textarea></div><div class="grid"><label><input id="asecret" type="checkbox" '+(a?.secret?'checked':'')+'> Secret until unlocked</label><label><input id="aclient" type="checkbox" '+(a?.client_unlockable!==false?'checked':'')+'> Allow client-side unlocks</label></div><div class="actions" style="margin-top:14px"><button class="primary" id="save">Save</button><button class="secondary" id="cancel">Cancel</button></div>';document.getElementById('content').prepend(c);c.querySelector('#cancel').onclick=()=>c.remove();c.querySelector('#save').onclick=async()=>{const payload={game_id:selected,achievement_key:document.getElementById('akey').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-'),name:document.getElementById('aname').value.trim(),description:document.getElementById('adesc').value.trim(),points:Number(document.getElementById('apoints').value)||0,icon_url:document.getElementById('aicon').value.trim()||null,secret:document.getElementById('asecret').checked,client_unlockable:document.getElementById('aclient').checked,enabled:true};if(!payload.achievement_key||!payload.name){alert('Key and name are required.');return;}let r=a?await sb.from('game_achievements').update(payload).eq('id',a.id):await sb.from('game_achievements').insert(payload);if(r.error){alert(r.error.message);return;}editing=null;await loadAchievements();};}
async function removeAchievement(id){if(!confirm('Delete this achievement?'))return;const r=await sb.from('game_achievements').delete().eq('id',id);if(r.error)alert(r.error.message);else loadAchievements();}
async function loadCredentials(){const c=document.getElementById('creds');const r=await sb.from('game_api_credentials').select('public_key,secret_last4,created_at,rotated_at').eq('game_id',selected).maybeSingle();if(r.error){c.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return;}c.innerHTML=r.data?'<p>Public key: <code>'+esc(r.data.public_key)+'</code><br>Server secret: <code>••••••••••••••••'+esc(r.data.secret_last4)+'</code></p>':'<p class="muted">No API credentials yet.</p>';}
async function rotateSecret(){if(!confirm('Rotate the server secret? The old secret will stop working.'))return;const r=await sb.rpc('rotate_game_api_secret',{target_game:selected});if(r.error){alert(r.error.message);return;}const c=document.getElementById('creds');c.innerHTML='<div class="notice success">New server secret. Save it now; it cannot be shown again.</div><div class="secret">'+esc(r.data.secret)+'</div><p>Public key: <code>'+esc(r.data.publicKey)+'</code></p>';}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='../../#/auth'};init();
</script></body></html>
